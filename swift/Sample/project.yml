name: LiveSample
options:
  bundleIdPrefix: fr.echimine.live
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LiveSDK:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LiveSample:
    type: application
    platform: iOS
    sources:
      - LiveSample
    dependencies:
      - package: LiveSDK
        product: LiveSDK
      - package: LiveSDK
        product: LiveSDKUI
    info:
      path: LiveSample/Info.plist
      properties:
        CFBundleDisplayName: Live Sample
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: La caméra sert à vous filmer pendant votre Live ou quand vous montez à l'écran. Rien n'est enregistré.
        NSMicrophoneUsageDescription: Le micro sert à vous faire entendre pendant votre Live ou quand vous montez à l'écran. Rien n'est enregistré.
        NSLocalNetworkUsageDescription: L'app d'exemple se connecte au serveur Live de votre machine de développement.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio, voip]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [livesample]
        LiveServerURL: $(LIVE_SERVER_URL)
        LiveAppId: $(LIVE_APP_ID)
        LiveTokenSecret: $(LIVE_TOKEN_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.echimine.live.sample
        LIVE_SERVER_URL: http://localhost:3000
        LIVE_APP_ID: demo-ios
        LIVE_TOKEN_SECRET: secret-factice-demo-ios-ne-jamais-utiliser-en-prod
