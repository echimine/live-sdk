# Environnement local de développement : Postgres + LiveKit en mode dev.
# Le serveur commun tourne à côté (`pnpm --filter @live-sdk/server dev`).
# Clés LiveKit du mode dev : devkey / secret (jamais utilisées en production).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-live}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-live}
      POSTGRES_DB: ${POSTGRES_DB:-live}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres-data:
