name: Deploy

# Chaque commit sur main touchant le serveur commun le redéploie sur live.echimine.fr :
# tests, image GHCR taguée par SHA, puis webhook du VPS.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'protocol/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/echimine/live-server

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://live:live@localhost:5432/live
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: live
          POSTGRES_PASSWORD: live
          POSTGRES_DB: live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live -d live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @live-sdk/server typecheck
      - run: pnpm --filter @live-sdk/server test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=live-server
          cache-to: type=gha,mode=max,scope=live-server

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Notifier le VPS (webhook)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          TAG: ${{ github.sha }}
        # Le hook répond dès le lancement du script : un succès ici ne prouve pas
        # le déploiement (vérifier Discord ou les logs du conteneur webhook).
        run: |
          curl -fsS -X POST "https://webhook.echimine.fr/hooks/deploy-live" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -d "{\"tag\":\"${TAG}\"}"
